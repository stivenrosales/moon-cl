name: docker

# Solo push a main: cada commit que llega a main es candidato a desplegarse
# en el VPS. El VPS nunca buildea — solo hace `pull` de lo que este workflow
# publica en GHCR.
on:
  push:
    branches: [main]

# El job de build necesita permiso para publicar paquetes (la imagen) en
# GHCR usando el propio GITHUB_TOKEN, sin secretos adicionales.
permissions:
  contents: read
  packages: write

jobs:
  # Gate real de este repo: npm run lint está roto (no hay config de ESLint
  # y `next lint` se cuelga pidiendo crear una interactivamente), así que NO
  # se ejecuta acá. tsc --noEmit + vitest son los que de verdad protegen main.
  gate:
    name: tsc + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Mismo motivo que en el Dockerfile, y hay que repetirlo acá porque
      # setup-node con Node 20 también trae npm 10: el lockfile se generó con
      # npm 11, que resuelve distinto una peerDependency opcional de next-auth
      # (nodemailer@^7). Con npm 10, `npm ci` falla con EUSAGE "Missing:
      # nodemailer" aunque package.json y el lock estén sincronizados.
      #
      # Node se queda en 20 a propósito: el gate debe correr sobre la misma
      # versión que la imagen de producción, no sobre una más nueva.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Chequeo de tipos
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

  build-and-push:
    name: build + push a GHCR
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Arma los tags (sha corto + latest) y el nombre de la imagen en
      # minúsculas: GHCR rechaza nombres con mayúsculas y el owner de un repo
      # de GitHub puede tenerlas.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # next.config.ts arma images.remotePatterns leyendo STORAGE_PUBLIC_URL,
          # y eso se evalúa en BUILD time, no en runtime. Sin esta línea el
          # patrón queda vacío acá (la env solo existe en el contenedor) y
          # <Image> bloquea en producción toda portada y todo avatar servidos
          # desde R2: el archivo está subido y accesible, pero Next se niega a
          # renderizarlo. Va como `vars` y no como `secrets` a propósito: el
          # host público del bucket viaja en el HTML de cualquier portada, no
          # es un secreto y no gana nada con estar oculto.
          build-args: |
            STORAGE_PUBLIC_URL=${{ vars.STORAGE_PUBLIC_URL }}
          # Cache de capas en GitHub Actions: builds siguientes no repiten
          # `npm ci` ni `next build` desde cero si nada relevante cambió.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sin esto la imagen se publica y ahí se queda: EasyPanel no vigila el
      # registry, hay que avisarle. El webhook dispara un pull de :latest y
      # reemplaza el contenedor.
      #
      # La URL COMPLETA es la credencial (lleva el token del servicio
      # embebido), por eso va entera en el secret y no se compone acá: un
      # token suelto en el YAML terminaría en los logs del run.
      #
      # continue-on-error a propósito: si el webhook falla, la imagen ya está
      # publicada y correcta. Marcar el build entero como rojo por un fallo
      # de despliegue haría creer que el código está mal cuando no lo está.
      - name: Avisar a EasyPanel que haga pull
        continue-on-error: true
        run: |
          codigo=$(curl -sS -o /dev/null -w "%{http_code}" -m 60 \
            -X POST "${{ secrets.EASYPANEL_DEPLOY_HOOK }}")
          echo "EasyPanel respondió HTTP $codigo"
          [ "$codigo" = "200" ] || exit 1
